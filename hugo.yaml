# Hugo configuration file
baseURL: https://01xjb.github.io/
title: 0xJB

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false
    guessSyntax: true

menu:
  main:
    - name: Writeups
      pageRef: /writeups
      weight: 1
    - name: Red Team Handbook
      pageRef: /handbook
      weight: 2
    - name: About
      pageRef: /about
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: Email
      weight: 5
      url: "mailto:jbernal@aetherguard.xyz"
      params:
        icon: mail
    - name: GitHub
      weight: 6
      url: "https://github.com/01xJB"
      params:
        icon: github
    - name: LinkedIn
      weight: 7
      url: "https://www.linkedin.com/in/0xjb/"
      params:
        icon: linkedin
    - name: Discord
      weight: 8
      url: "https://discord.gg/rDYw38Mmw"
      params:
        icon: discord
    - name: AetherGuard CTF
      weight: 9
      url: "https://ctf.aetherguard.xyz/"
      params:
        icon: flag

params:
  description: Offensive security writeups, CTF walkthroughs, and red team notes.

  theme:
    default: dark
    displayToggle: true

  page:
    width: wide

  toc:
    displayTags: true

  imageZoom:
    enable: true

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/01xJB/01xJB.github.io/edit/main/content"
